name: Read one Store ruleset
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ruleset:
    if: >-
      ${{ github.repository == 'szoceikaiser/btc-signal-app' &&
          github.ref == 'refs/heads/main' &&
          github.run_attempt == '1' &&
          vars.BTC_RECOVERY_ENABLED == 'false' }}
    environment: btc-delivery-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify reviewed probe
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum --status -c <<'EOF'
          7c0acad466c934960687d285d927edfa6a68a02a6ce69891d8af75833b29a42a  tools/recovery_rule_probe.py
          EOF
      - name: Read the Store ruleset with both credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BTC_DELIVERY_GITHUB_TOKEN: ${{ secrets.BTC_REVIEWED_STORE_TOKEN }}
        run: python3 -B tools/recovery_rule_probe.py
