# Free/public: explicit IDs and actual rules/credential reviews still required.
# Disabled hosted candidate; intended target .github/workflows/backup-verify.yml
name: backup-verify
run-name: btc-v2:backup:${{ inputs.expected_start_ms || 'created' }}
on:
  workflow_dispatch:
    inputs:
      expected_start_ms:
        description: Original UTC backup occurrence in milliseconds; empty binds run created_at
        type: string
        required: false
        default: ""
  # Separate external verifier occurrence; no native GitHub schedule.
permissions:
  contents: read
  actions: read
concurrency:
  group: btc-backup-verify
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    if: ${{ true }}
    runs-on: ubuntu-24.04
    environment: btc-backup-verifier
    timeout-minutes: 35
    steps:
      - name: Require Git and stop checkout network after any Git failure
        shell: bash
        run: |
          set -euo pipefail
          real_git="$(command -v git)"
          [[ "$(printf '%s\n' 2.18.0 "$(git version | cut -d' ' -f3)" | sort -V | head -n1)" == "2.18.0" ]]
          gate_dir="$(mktemp -d "$RUNNER_TEMP/btc-checkout-XXXXXX")"
          printf '#!/bin/bash\nreal_git=%q\n' "$real_git" > "$gate_dir/git"
          cat >> "$gate_dir/git" <<'GIT_GATE'
          set -u
          network=false
          for arg in "$@"; do
            case "$arg" in fetch|clone|ls-remote) network=true ;; esac
          done
          if ! "$network"; then exec "$real_git" "$@"; fi
          stop_file="$(dirname "$0")/STOP"
          if [[ -e "$stop_file" ]]; then exit 86; fi
          "$real_git" "$@"
          status=$?
          if [[ "$status" -ne 0 ]]; then : > "$stop_file"; fi
          exit "$status"
          GIT_GATE
          chmod 700 "$gate_dir/git"
          printf '%s\n' "$gate_dir" >> "$GITHUB_PATH"
      - name: Checkout exact reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: core
          ref: 20d755a4332fb32aeab08b1973b650eeae10f31e
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Checkout independently hash-reviewed delivery extension
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: extension
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout pin before loading code
        env:
          REVIEWED_CODE_SHA: 20d755a4332fb32aeab08b1973b650eeae10f31e
        shell: bash
        run: |
          [[ "$GITHUB_REPOSITORY" == "szoceikaiser/btc-signal-app" ]]
          [[ "$REVIEWED_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C core rev-parse HEAD)" == "$REVIEWED_CODE_SHA" ]]
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Checked exclusive temporary verifier entry
        working-directory: core
        env:
          BTC_HOSTED_RUNTIME_JSON: ${{ vars.BTC_HOSTED_RUNTIME_JSON }}
          BTC_HOSTED_RUNTIME_SHA256: ${{ vars.BTC_HOSTED_RUNTIME_SHA256 }}
          GITHUB_TOKEN: ${{ github.token }}
          BTC_ACTIONS_EXPLICIT_START_MS: ${{ inputs.expected_start_ms }}
          BTC_HOSTED_RECEIPT_WRITE_TOKEN: ${{ secrets.BTC_HOSTED_RECEIPT_WRITE_TOKEN }}
        run: |-
          python3 -c 'import hashlib,runpy,sys,pathlib; exec("try:\n p=\"../extension/tools/pinned_delivery_entry.py\"\n if hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()!=\"b4d0ad7d1188d41fa79f85b3f5933a6dc1ec342727dedffce8a08acf7d88c4cc\": raise ValueError()\n runpy.run_path(p,run_name=\"__main__\")\nexcept SystemExit: raise\nexcept BaseException: sys.exit(\"delivery phase=bootstrap reason=binding_refused\")")' --core . --extension ../extension --manifest-sha256 726d4b4454c38136ae128b32f611e78a95a8cea6ffc99dd5c953141019f2649a --tool p4_hosted_backup.py -- verifier
