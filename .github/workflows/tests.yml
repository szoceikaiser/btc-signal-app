name: Tests
run-name: One Linux offline repair acceptance

on:
  push:
    branches:
      - codex/linux-reparatur-abnahme-20261016

permissions:
  contents: read

jobs:
  tests:
    name: full-offline-python-3.12.14
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Fixed scientific test dependency
        run: python -m pip install numpy==2.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Complete offline acceptance, inventory, AS measurements and bounded details
        run: python -B tools/offline_acceptance.py --jobs 4 --out "${{ runner.temp }}/btc-linux-repair"
