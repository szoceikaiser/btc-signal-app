name: Tests
run-name: Reviewed runtime offline acceptance
on:
  push:
    branches: [main]
    paths: ["engine/**", "tools/**", "ops/produktion/**", ".github/workflows/**", "site/*.html", "site/*.js"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout independently accepted runtime and fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 20d755a4332fb32aeab08b1973b650eeae10f31e
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Fixed scientific test dependency
        run: python -m pip install numpy==2.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.12.0"
      - name: Complete accepted runtime offline checks
        run: python -B tools/offline_acceptance.py --jobs 4 --out "${{ runner.temp }}/btc-production-acceptance"
