name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Unit-Tests ausfuehren
        run: cd engine && python3 run_tests.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed scientific test dependency
        run: python -m pip install numpy==2.3.5
      - name: Synthetic statistics and offline latency protection tests
        run: |
          python tools/test_historical_stats.py
          python tools/verify_n6_probes.py
