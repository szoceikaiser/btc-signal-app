name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed scientific test dependency
        run: python -m pip install numpy==2.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Unit-Tests ausfuehren (offline, isolated)
        run: python engine/run_tests.py --out "${{ runner.temp }}/btc-offline-tests"
      - name: Synthetic statistics and offline latency protection tests
        run: |
          python tools/test_historical_stats.py
          python tools/verify_n6_probes.py
