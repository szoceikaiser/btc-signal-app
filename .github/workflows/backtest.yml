name: Backtest
run-name: C05 aktuell – höchstens 365 Tage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-c05-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prüfprogramm und Archiv zum manuellen Start
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: report-source
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Unveränderte abgenommene Engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: core
          ref: 20d755a4332fb32aeab08b1973b650eeae10f31e
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Zeitfenster und Archivbehandlung offline prüfen
        working-directory: report-source
        run: python3 -B -m unittest discover -s tools -p test_rolling_backtest.py -v
      - name: Aktuellen C05-Backtest rechnen
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          REVIEWED_CONFIG_JSON: ${{ vars.BTC_REVIEWED_CONFIG_JSON }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -B report-source/tools/rolling_backtest.py
          --core core --archive report-source/site/data/archiv/coinalyze_4h.json
          --out "${{ runner.temp }}/c05-backtest"
      - name: Bericht in der Laufübersicht anzeigen
        run: cat "${{ runner.temp }}/c05-backtest/BACKTEST.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Bericht und vollständige Recheneingaben aufbewahren
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: C05-Backtest-${{ github.run_id }}
          path: ${{ runner.temp }}/c05-backtest/
          if-no-files-found: warn
          retention-days: 90
