name: Nach-6 Historische Rohdaten

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-data:
    if: github.ref == 'refs/heads/codex/nach-6-historische-auswertung'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fixed-cutoff historical market GETs
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python3 tools/fetch_n6_data.py

      - uses: actions/upload-artifact@v4
        with:
          name: nach-6-historical-raw
          path: historical-raw/
          if-no-files-found: error
          retention-days: 30
