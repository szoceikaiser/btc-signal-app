name: Signal-Engine

on:
  schedule:
    # Gezielt statt haeufig (Befund 2026-07-27): Der 15-Minuten-Takt wurde von GitHub
    # massiv verworfen — statt ~96 Laeufen am Tag kamen nur 6-7 an, im Abstand von 1 bis
    # 3,5 Stunden, alle gruen (kein Fehler, GitHub laesst Schedules bei Last einfach aus).
    # Die Strategie wertet ABGESCHLOSSENE 4h-Kerzen aus (Schluss 00/04/08/12/16/20 UTC),
    # dazwischen gibt es nichts zu tun.
    #
    # NACHMESSUNG 2026-07-29 (Kaiser): Auch mit 4 Versuchen je Kerzenschluss kam nur etwa
    # EINER an — gemessener Verzug 1:08 h, 1:27 h und 2:38 h nach Kerzenschluss. Die
    # Trefferquote liegt also bei rund 1:4. Konsequenz: dieselbe Anzahl Kerzenschluesse,
    # aber die Versuche enger nach vorn gelegt — 7 Versuche in der ERSTEN HALBEN STUNDE
    # statt 4 ueber eine volle Stunde. Bei gleicher Verwurfsquote landet der erste
    # Treffer damit statistisch deutlich frueher. 42 Laeufe/Tag (vorher 24, urspruenglich
    # 96) — weit unter jeder Grenze, und Schedules werden nicht wegen Menge verworfen,
    # sondern wegen Plattform-Last.
    #
    # WICHTIG, was das NICHT loest: GitHub gibt keine Zusage fuer Zeitplaene. Der Verzug
    # kann trotzdem auftreten. Wer Puenktlichkeit braucht, muss die Engine von aussen
    # anstossen (z. B. cron-job.org gegen workflow_dispatch) — solche Anstoesse laufen
    # nicht ueber die Schedule-Warteschlange. Bewusst nicht gemacht: Dafuer muesste ein
    # GitHub-Token bei einem Fremdanbieter liegen.
    #
    # Erst ab Minute 2, damit die 4h-Kerze sicher geschlossen ist (main.py verwirft
    # offene Kerzen ohnehin, aber so gibt es keinen Leerlauf).
    - cron: "2,7,12,17,22,27,32 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Nur Telegram-Testnachricht senden"
        type: boolean
        default: false
      resend_all:
        description: "Alle bisherigen Trigger erneut an Telegram senden"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signal-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Telegram-Testnachricht
        if: ${{ inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: cd engine && python3 main.py --test-telegram

      - name: Alle Trigger erneut senden
        if: ${{ inputs.resend_all }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: cd engine && python3 main.py --resend-all

      - name: Engine-Lauf
        if: ${{ !inputs.test_telegram && !inputs.resend_all }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: cd engine && python3 main.py

      - name: Zustand committen
        if: ${{ !inputs.test_telegram && !inputs.resend_all }}
        run: |
          git config user.name "signal-engine"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Engine-Lauf: Zustand aktualisiert"
          # Erst ziehen, dann schieben: sonst scheitert der Push, sobald zwischen
          # Checkout und Push etwas anderes committet hat (Backtest-Workflow, Kaisers
          # Aenderung an config.json im Browser). Der Backtest-Workflow macht das
          # laengst richtig, hier fehlte es.
          git pull --no-rebase --no-edit
          git push
