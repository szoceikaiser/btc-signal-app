name: E44.5 Kombinationsmessung
on:
  workflow_dispatch:
    inputs:
      replay:
        description: Gesicherten Eingabestand ohne neue Marktdaten wiederholen
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  messen:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests vor Messung
        run: cd engine && python3 run_tests.py
      - name: Sabotage-Proben
        run: cd engine && python3 -u sabotage_e445.py
      - name: Gitter messen
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          E445_REPLAY: ${{ inputs.replay }}
        run: |
          cd engine
          if [ "$E445_REPLAY" = "true" ]; then
            python3 -u e445.py --replay ../docs/e445/eingaben.json
          else
            python3 -u e445.py
          fi
      - name: Wiederholung ist identisch
        if: inputs.replay
        run: git diff --exit-code -- docs/e445/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e445-messung
          path: docs/e445/
      - name: Bericht auf Arbeitszweig sichern
        run: |
          git config user.name "backtest"
          git config user.email "actions@users.noreply.github.com"
          git add docs/e445/
          git diff --cached --quiet || git commit -m "E44.5 combination measurement"
          git pull --rebase
          git fetch origin main
          git diff --stat HEAD...origin/main
          git push origin HEAD:${{ github.ref_name }}
