# Free/public: explicit IDs and actual rules/credential reviews still required.
# Disabled hosted candidate; intended target .github/workflows/backup.yml
name: backup
run-name: btc-v2:backup:${{ inputs.expected_start_ms || 'created' }}
on:
  workflow_dispatch:
    inputs:
      expected_start_ms:
        description: Original UTC backup occurrence in milliseconds; empty binds run created_at
        type: string
        required: false
        default: ""
  # Daily occurrence will be dispatched by cron-job.org.
permissions:
  contents: read
  actions: read
concurrency:
  group: btc-backup
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    if: ${{ true }}
    runs-on: ubuntu-24.04
    environment: btc-backup-producer
    timeout-minutes: 35
    steps:
      - name: Require Git and stop checkout network after any Git failure
        shell: bash
        run: |
          set -euo pipefail
          real_git="$(command -v git)"
          [[ "$(printf '%s\n' 2.18.0 "$(git version | cut -d' ' -f3)" | sort -V | head -n1)" == "2.18.0" ]]
          gate_dir="$(mktemp -d "$RUNNER_TEMP/btc-checkout-XXXXXX")"
          printf '#!/bin/bash\nreal_git=%q\n' "$real_git" > "$gate_dir/git"
          cat >> "$gate_dir/git" <<'GIT_GATE'
          set -u
          network=false
          for arg in "$@"; do
            case "$arg" in fetch|clone|ls-remote) network=true ;; esac
          done
          if ! "$network"; then exec "$real_git" "$@"; fi
          stop_file="$(dirname "$0")/STOP"
          if [[ -e "$stop_file" ]]; then exit 86; fi
          "$real_git" "$@"
          status=$?
          if [[ "$status" -ne 0 ]]; then : > "$stop_file"; fi
          exit "$status"
          GIT_GATE
          chmod 700 "$gate_dir/git"
          printf '%s\n' "$gate_dir" >> "$GITHUB_PATH"
      - name: Checkout exact reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: core
          ref: 20d755a4332fb32aeab08b1973b650eeae10f31e
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Checkout independently hash-reviewed delivery extension
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: extension
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout pin before loading code
        env:
          REVIEWED_CODE_SHA: 20d755a4332fb32aeab08b1973b650eeae10f31e
        shell: bash
        run: |
          [[ "$GITHUB_REPOSITORY" == "szoceikaiser/btc-signal-app" ]]
          [[ "$REVIEWED_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C core rev-parse HEAD)" == "$REVIEWED_CODE_SHA" ]]
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Checked exclusive temporary producer entry
        working-directory: core
        env:
          BTC_HOSTED_RUNTIME_JSON: ${{ vars.BTC_HOSTED_RUNTIME_JSON }}
          BTC_HOSTED_RUNTIME_SHA256: ${{ vars.BTC_HOSTED_RUNTIME_SHA256 }}
          GITHUB_TOKEN: ${{ github.token }}
          BTC_ACTIONS_EXPLICIT_START_MS: ${{ inputs.expected_start_ms }}
          BTC_HOSTED_BACKUP_WRITE_TOKEN: ${{ secrets.BTC_HOSTED_BACKUP_WRITE_TOKEN }}
        run: |-
          python3 - <<'PY'
          import hashlib, sys
          from pathlib import Path
          try:
              path = Path('../extension/ops/continuous/backup_diagnostic.py')
              body = path.read_bytes()
              if hashlib.sha256(body).hexdigest() != '767cb91b1ad5cd68f91f1577e53f2b93b138668579aa2313cc79248dad96d783':
                  raise ValueError()
              scope = {'__name__': 'reviewed_backup_diagnostic'}
              exec(compile(body, str(path), 'exec'), scope)
              status = scope['execute'](Path('.'), Path('../extension'), 'b2cf523146175d3f7216af9bab313d003f49e4405c1bb2682fd6bb93e2fdc95b', 'b9fb84e1357330f5829dfb1d3bcd8f5543abdcba875b7246e378de0b11f59a2f', '0c2af464f2cd0a44f6ebd0dc2ebd5eee83d168eabc9c9879a5a2d848084fc579')
          except Exception:
              sys.exit('backup diagnostic phase=bootstrap reason=binding_refused')
          sys.exit(status)
          PY
