name: BTC bounded recovery
on:
  workflow_run:
    workflows: ["Signal-Engine", "Flush-Wache"]
    types: [completed]
  workflow_dispatch:
    inputs:
      probe_workflow_sha256:
        description: Reviewed recovery.yml SHA-256 for the read-only production probe
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: btc-bounded-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: >-
      ${{ (vars.BTC_RECOVERY_ENABLED == 'true' && (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.probe_workflow_sha256 == ''))) ||
          (vars.BTC_RECOVERY_ENABLED == 'false' && github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
           inputs.probe_workflow_sha256 != '') ||
          (vars.BTC_RECOVERY_ENABLED == 'false' && vars.BTC_RECOVERY_ONCE_JSON != '' &&
           github.event_name == 'workflow_run' && github.repository == 'szoceikaiser/btc-signal-app' &&
           github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
           github.event.workflow_run.workflow_id == 323116288 && github.event.workflow_run.run_attempt == 1 &&
           github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    name: recover
    environment: btc-delivery-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: core
          ref: 20d755a4332fb32aeab08b1973b650eeae10f31e
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: extension
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Require explicitly reviewed recovery policy
        if: ${{ vars.BTC_RECOVERY_ENABLED == 'true' && (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.probe_workflow_sha256 == '')) }}
        env:
          REVIEWED_RECOVERY_JSON: ${{ vars.BTC_RECOVERY_POLICY_JSON }}
        run: |-
          python3 - <<'PY'
          import json, os, hashlib, sys
          from pathlib import Path
          sys.excepthook=lambda *_: print('operations phase=policy reason=binding_refused',file=sys.stderr)
          raw=os.environ['REVIEWED_RECOVERY_JSON']
          if len(raw.encode())>128*1024: raise SystemExit('Recovery policy refused')
          p=json.loads(raw)
          if (p.get('enabled') is not True or p.get('activation_reviewed') is not True
                  or p['journal'].get('reviewed') is not True
                  or p['recovery_entry']['workflow_sha256']!=hashlib.sha256(Path('extension/.github/workflows/recovery.yml').read_bytes()).hexdigest()):
              raise SystemExit('Recovery policy refused')
          Path('recovery-policy.json').write_text(raw,encoding='utf-8')
          PY
      - name: Inspect and recover one bounded incident
        if: ${{ vars.BTC_RECOVERY_ENABLED == 'true' && (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.probe_workflow_sha256 == '')) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BTC_DELIVERY_GITHUB_TOKEN: ${{ secrets.BTC_REVIEWED_STORE_TOKEN }}
        run: |-
          python3 - <<'PY'
          import hashlib, sys
          from pathlib import Path
          try:
              extension = Path('extension')
              path = extension / 'ops/continuous/recovery_writer.py'
              body = path.read_bytes()
              if hashlib.sha256(body).hexdigest() != '0b3cebbc0d8a76aab59de0e5f42feda80ed76c48f8e09dfce67b8edd30db78c0':
                  raise ValueError()
              entry = {'__name__': 'reviewed_recovery_writer'}
              exec(compile(body, str(path), 'exec'), entry)
              status = entry['main'](Path('core'), extension, '742f150242721f3043f12946ace1e1e5eb3efab29ee327dee49d3eb4e9bb8a00', 'f20d18f09ad403f2742d0af1661c9e7d83a1be63ae3d9723f195287e433e10d7')
          except BaseException:
              sys.exit('operations phase=writer_bootstrap reason=binding_refused')
          sys.exit(status)
          PY
      - name: Observe production recovery with GET only
        if: >-
          ${{ vars.BTC_RECOVERY_ENABLED == 'false' && github.event_name == 'workflow_dispatch' &&
              github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
              inputs.probe_workflow_sha256 != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_ENABLED: ${{ vars.BTC_RECOVERY_ENABLED }}
          PROBE_WORKFLOW_SHA256: ${{ inputs.probe_workflow_sha256 }}
          REVIEWED_RECOVERY_JSON: ${{ vars.BTC_RECOVERY_POLICY_JSON }}
        run: |-
          python3 - <<'PY'
          import hashlib, sys
          from pathlib import Path
          try:
              path = Path('extension/ops/continuous/recovery_read_probe.py')
              body = path.read_bytes()
              if hashlib.sha256(body).hexdigest() != 'a4bc9d607392bf7ce8841dc3d614088a8818e423f6cfc109ffd4dc6e0fc574f9':
                  raise ValueError()
              exec(compile(body, str(path), 'exec'), {'__name__': '__main__'})
          except SystemExit:
              raise
          except BaseException:
              sys.exit('recovery probe phase=bootstrap reason=binding_refused')
          PY
      - name: Observe one regular Watch in automatic recovery
        if: >-
          ${{ vars.BTC_RECOVERY_ENABLED == 'false' && vars.BTC_RECOVERY_ONCE_JSON != '' &&
           github.event_name == 'workflow_run' && github.repository == 'szoceikaiser/btc-signal-app' &&
           github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
           github.event.workflow_run.workflow_id == 323116288 && github.event.workflow_run.run_attempt == 1 &&
           github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BTC_DELIVERY_GITHUB_TOKEN: ${{ secrets.BTC_REVIEWED_STORE_TOKEN }}
          RECOVERY_ENABLED: ${{ vars.BTC_RECOVERY_ENABLED }}
          RECOVERY_ONCE: ${{ vars.BTC_RECOVERY_ONCE_JSON }}
          REVIEWED_RECOVERY_JSON: ${{ vars.BTC_RECOVERY_POLICY_JSON }}
        run: |-
          python3 - <<'PY'
          import hashlib, sys
          from pathlib import Path
          extension = Path('extension')
          def load(name, expected):
              path = extension / 'ops/continuous' / (name + '.py')
              body = path.read_bytes()
              if hashlib.sha256(body).hexdigest() != expected:
                  raise ValueError()
              scope = {'__name__': name}
              exec(compile(body, str(path), 'exec'), scope)
              return scope
          try:
              writer = load('recovery_writer', '0b3cebbc0d8a76aab59de0e5f42feda80ed76c48f8e09dfce67b8edd30db78c0')
              once = load('recovery_once', '626831a53572b4e386e3a53f59b466ebcfc8555f6873184dcebdfbc00875d658')
              status = once['main'](writer, extension, Path('core'), '742f150242721f3043f12946ace1e1e5eb3efab29ee327dee49d3eb4e9bb8a00', 'f20d18f09ad403f2742d0af1661c9e7d83a1be63ae3d9723f195287e433e10d7')
          except Exception:
              sys.exit('operations phase=diagnostic_bootstrap reason=binding_refused')
          sys.exit(status)
          PY
