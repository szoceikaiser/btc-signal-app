name: BTC bounded recovery
on:
  workflow_run:
    workflows: ["Signal-Engine", "Flush-Wache"]
    types: [completed]
  workflow_dispatch:
    inputs:
      probe_workflow_sha256:
        description: Reviewed recovery.yml SHA-256 for the read-only production probe
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: btc-bounded-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: >-
      ${{ (vars.BTC_RECOVERY_ENABLED == 'true' && (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.probe_workflow_sha256 == ''))) ||
          (vars.BTC_RECOVERY_ENABLED == 'false' && github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
           inputs.probe_workflow_sha256 != '') }}
    name: recover
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: core
          ref: 20d755a4332fb32aeab08b1973b650eeae10f31e
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: extension
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Require explicitly reviewed recovery policy
        if: ${{ vars.BTC_RECOVERY_ENABLED == 'true' && (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.probe_workflow_sha256 == '')) }}
        env:
          REVIEWED_RECOVERY_JSON: ${{ vars.BTC_RECOVERY_POLICY_JSON }}
        run: |-
          python3 - <<'PY'
          import json, os, hashlib, sys
          from pathlib import Path
          sys.excepthook=lambda *_: print('operations phase=policy reason=binding_refused',file=sys.stderr)
          raw=os.environ['REVIEWED_RECOVERY_JSON']
          if len(raw.encode())>128*1024: raise SystemExit('Recovery policy refused')
          p=json.loads(raw)
          if (p.get('enabled') is not True or p.get('activation_reviewed') is not True
                  or p['journal'].get('reviewed') is not True
                  or p['recovery_entry']['workflow_sha256']!=hashlib.sha256(Path('extension/.github/workflows/recovery.yml').read_bytes()).hexdigest()):
              raise SystemExit('Recovery policy refused')
          Path('recovery-policy.json').write_text(raw,encoding='utf-8')
          PY
      - name: Inspect and recover one bounded incident
        if: ${{ vars.BTC_RECOVERY_ENABLED == 'true' && (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.probe_workflow_sha256 == '')) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BTC_DELIVERY_GITHUB_TOKEN: ${{ secrets.BTC_REVIEWED_STORE_TOKEN }}
        run: |-
          python3 - <<'PY'
          import hashlib, sys
          from pathlib import Path
          try:
              extension = Path('extension')
              path = extension / 'ops/continuous/recovery_writer.py'
              body = path.read_bytes()
              if hashlib.sha256(body).hexdigest() != '9a725c9855253e553ddc134eed5fb81fc9fe7d9da546e3df50dab1cf60c2e74e':
                  raise ValueError()
              entry = {'__name__': 'reviewed_recovery_writer'}
              exec(compile(body, str(path), 'exec'), entry)
              status = entry['main'](Path('core'), extension, 'b2cf523146175d3f7216af9bab313d003f49e4405c1bb2682fd6bb93e2fdc95b', 'b9fb84e1357330f5829dfb1d3bcd8f5543abdcba875b7246e378de0b11f59a2f')
          except BaseException:
              sys.exit('operations phase=writer_bootstrap reason=binding_refused')
          sys.exit(status)
          PY
      - name: Observe production recovery with GET only
        if: >-
          ${{ vars.BTC_RECOVERY_ENABLED == 'false' && github.event_name == 'workflow_dispatch' &&
              github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
              inputs.probe_workflow_sha256 != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_ENABLED: ${{ vars.BTC_RECOVERY_ENABLED }}
          PROBE_WORKFLOW_SHA256: ${{ inputs.probe_workflow_sha256 }}
          REVIEWED_RECOVERY_JSON: ${{ vars.BTC_RECOVERY_POLICY_JSON }}
        run: |-
          python3 - <<'PY'
          import hashlib, sys
          from pathlib import Path
          try:
              path = Path('extension/ops/continuous/recovery_read_probe.py')
              body = path.read_bytes()
              if hashlib.sha256(body).hexdigest() != 'a4bc9d607392bf7ce8841dc3d614088a8818e423f6cfc109ffd4dc6e0fc574f9':
                  raise ValueError()
              exec(compile(body, str(path), 'exec'), {'__name__': '__main__'})
          except SystemExit:
              raise
          except BaseException:
              sys.exit('recovery probe phase=bootstrap reason=binding_refused')
          PY
