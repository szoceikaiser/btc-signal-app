name: BTC bounded recovery
on:
  workflow_run:
    workflows: ["Signal-Engine", "Flush-Wache"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: btc-bounded-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ vars.BTC_RECOVERY_ENABLED == 'true' }}
    name: recover
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: core
          ref: 20d755a4332fb32aeab08b1973b650eeae10f31e
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: extension
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Require explicitly reviewed recovery policy
        env:
          REVIEWED_RECOVERY_JSON: ${{ vars.BTC_RECOVERY_POLICY_JSON }}
        run: |-
          python3 - <<'PY'
          import json, os, hashlib, sys
          from pathlib import Path
          sys.excepthook=lambda *_: print('operations phase=policy reason=binding_refused',file=sys.stderr)
          raw=os.environ['REVIEWED_RECOVERY_JSON']
          if len(raw.encode())>128*1024: raise SystemExit('Recovery policy refused')
          p=json.loads(raw)
          if (p.get('enabled') is not True or p.get('activation_reviewed') is not True
                  or p['journal'].get('reviewed') is not True
                  or p['recovery_entry']['workflow_sha256']!=hashlib.sha256(Path('extension/.github/workflows/recovery.yml').read_bytes()).hexdigest()):
              raise SystemExit('Recovery policy refused')
          Path('recovery-policy.json').write_text(raw,encoding='utf-8')
          PY
      - name: Inspect and recover one bounded incident
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BTC_DELIVERY_GITHUB_TOKEN: ${{ secrets.BTC_REVIEWED_STORE_TOKEN }}
        run: |-
          python3 -c 'import hashlib,runpy,sys,pathlib; exec("try:\n p=\"extension/tools/pinned_delivery_entry.py\"\n if hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()!=\"b2cf523146175d3f7216af9bab313d003f49e4405c1bb2682fd6bb93e2fdc95b\": raise ValueError()\n runpy.run_path(p,run_name=\"__main__\")\nexcept SystemExit: raise\nexcept BaseException: sys.exit(\"delivery phase=bootstrap reason=binding_refused\")")' --core core --extension extension --manifest-sha256 b9fb84e1357330f5829dfb1d3bcd8f5543abdcba875b7246e378de0b11f59a2f --tool continuous_operations.py -- --github --policy recovery-policy.json --result-file recovery-result.json
