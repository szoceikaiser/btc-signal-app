# Disabled hosted candidate; intended target .github/workflows/backup.yml
name: backup
run-name: btc-v2:backup:${{ inputs.expected_start_ms || 'created' }}
on:
  workflow_dispatch:
    inputs:
      expected_start_ms:
        description: Original UTC backup occurrence in milliseconds; empty binds run created_at
        type: string
        required: false
        default: ""
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: read
  actions: read
concurrency:
  group: btc-backup
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    environment: btc-backup-producer
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ vars.BTC_HOSTED_CODE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Checked exclusive temporary producer entry
        env:
          BTC_HOSTED_RUNTIME_JSON: ${{ vars.BTC_HOSTED_RUNTIME_JSON }}
          BTC_HOSTED_RUNTIME_SHA256: ${{ vars.BTC_HOSTED_RUNTIME_SHA256 }}
          BTC_HOSTED_METADATA_READ_TOKEN: ${{ github.token }}
          BTC_ACTIONS_EXPLICIT_START_MS: ${{ inputs.expected_start_ms }}
          BTC_HOSTED_SOURCE_READ_TOKEN: ${{ secrets.BTC_HOSTED_SOURCE_READ_TOKEN }}
          BTC_HOSTED_BACKUP_WRITE_TOKEN: ${{ secrets.BTC_HOSTED_BACKUP_WRITE_TOKEN }}
          BTC_HOSTED_RECEIPT_READ_TOKEN: ${{ secrets.BTC_HOSTED_RECEIPT_READ_TOKEN }}
        run: python3 tools/p4_hosted_backup.py producer
