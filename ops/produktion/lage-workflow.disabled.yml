# Disabled candidate; intended target .github/workflows/lage.yml
name: Lage abrufen
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-delivery-single-stream
  cancel-in-progress: false
jobs:
  delivery:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare exact reviewed runtime (no store or transport)
        env:
          REVIEWED_RUNTIME_JSON: ${{ vars.BTC_REVIEWED_RUNTIME_JSON }}
          REVIEWED_CONFIG_JSON: ${{ vars.BTC_REVIEWED_CONFIG_JSON }}
        run: python3 tools/produktion_runtime_prepare.py --kind lage --out .runtime
      - name: Bind this occurrence
        env:
          EXPLICIT_OCCURRENCE: ${{ inputs.expected_start_ms }}
        run: |
          python3 - <<'PY'
          import os, time
          now = int(time.time()*1000)
          slot = 0
          occurrence = os.environ.get('EXPLICIT_OCCURRENCE') or str(now//slot*slot if slot else now)
          if not occurrence.isdigit() or int(occurrence) <= 0:
              raise ValueError('Positive UTC occurrence required')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('BTC_DELIVERY_EXPECTED_START_MS='+occurrence+'\n')
          PY
      - name: Checked lage entry
        env:
          BTC_DELIVERY_ADAPTER: github
          BTC_DELIVERY_RUNNER_ROOT: ${{ github.workspace }}
          BTC_DELIVERY_RUN_REPOSITORY: ${{ github.repository }}
          BTC_DELIVERY_WORKFLOW: .github/workflows/lage.yml
          BTC_DELIVERY_RUN_ID: ${{ github.run_id }}
          BTC_DELIVERY_RUN_ATTEMPT: ${{ github.run_attempt }}
          BTC_DELIVERY_CODE_SHA: ${{ github.sha }}
          BTC_DELIVERY_STORE_ID: ${{ vars.BTC_REVIEWED_STORE_ID }}
          BTC_DELIVERY_GITHUB_REPO: ${{ vars.BTC_REVIEWED_STORE_REPOSITORY }}
          BTC_DELIVERY_GITHUB_BRANCH: ${{ vars.BTC_REVIEWED_STORE_BRANCH }}
          BTC_DELIVERY_FENCE_BRANCH: ${{ vars.BTC_REVIEWED_FENCE_BRANCH }}
          BTC_DELIVERY_BOT_IDENTITY: ${{ vars.BTC_REVIEWED_BOT_IDENTITY }}
          BTC_DELIVERY_CONFIRMATION_POLICY: github-actions-fence-v2
          BTC_DELIVERY_GITHUB_TOKEN: ${{ secrets.BTC_REVIEWED_STORE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python3 tools/produktion_actions_runner.py --runtime .runtime/runtime.json --kind lage --data-dir .runtime/data
